[package]
name = "etcd-workbench"
version = "1.2.6"
description = "Etcd Workbench"
authors = ["beifengtz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.6", features = [] }
prost-build = "0.14.1"
regex = "1.11.3"

# [target.'cfg(target_os = "macos")'.dependencies]

[dependencies]
tauri = { version = "1.8.3", features = [ "os-all", "shell-open", "window-all", "dialog-open", "dialog-save", "dialog-ask", "updater", "clipboard-write-text", "process-relaunch", "notification"] }
#fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
window-shadows = "0.2.2"

tokio = { version = "1.46.1", features = ["full"] }
log = "0.4.28"
env_logger = "0.11.8"
dashmap = "6.1.0"
# etcd-client = { version = "0.16.1", features = [] }
etcd-client = { git = "https://github.com/tzfun/etcd-client" }
lazy_static = "1.5.0"
russh = { version = "0.54.6",default-features = false, features = ["ring", "rsa", "flate2"] }
uuid = "1.17.0"
md5 = "0.8.0"
base64 = "0.22.1"
async-trait = { version = "0.1.89" }
prost = "0.14"
aes = "0.8.4"
reqwest = {version = "0.11.27", features= ["rustls-tls"] }

# 仅在 etcd-client-tls (rustls) 路径下用于实现 “跳过证书校验” 时预取服务端证书并解析 SAN
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
x509-parser = { version = "0.16", optional = true }

[features]
default = ["etcd-client-tls"]

# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
etcd-client-tls = [
    "etcd-client/tls",
    "etcd-client/tls-roots",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:x509-parser",
]
# 依赖本地 perf
etcd-client-tls-openssl = ["etcd-client/tls-openssl-vendored"]

[profile.release]
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size, 'z' or 's'
strip = true # Remove debug symbols
panic = "abort"
